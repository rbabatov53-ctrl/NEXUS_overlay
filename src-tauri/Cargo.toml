[package]
name = "nexus-overlay"
version = "0.1.0"
description = "NEXUS gaming overlay"
authors = ["NEXUS"]
edition = "2021"

[lib]
name = "nexus_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Foundation",
    "Media_Control",
] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "native-tls"] }
